<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>WANTED: DEAD OR RENDERED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--night:#12081f;--plum:#2a0f45;--pink:#ff2e88;--orange:#ff8a3d;--yellow:#ffd23f;--teal:#19e3d6;--red:#ff3355;--ink:#0b0612}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
html,body{min-height:100%;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.display{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.type{font-family:'Special Elite',ui-monospace,monospace}
.hidden{display:none!important}

/* ---------- LA sunset backdrop ---------- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#0b0518 0%,#1d0a35 42%,#4a1460 70%,#b0256f 88%,#ff8a3d 100%)}
.sun{position:absolute;left:50%;bottom:16%;width:46vmin;height:46vmin;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#ffd23f,#ff8a3d 45%,#ff2e88 85%);opacity:.5;filter:blur(.3px)}
.sun::after{content:"";position:absolute;inset:52% 0 0 0;background:repeating-linear-gradient(180deg,transparent 0 9px,#7a1a62 9px 15px)}
.grid-floor{position:absolute;left:-50%;right:-50%;bottom:0;height:34%;background-image:linear-gradient(rgba(255,46,136,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,46,136,.55) 1px,transparent 1px);background-size:64px 64px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;opacity:.4;-webkit-mask-image:linear-gradient(to top,#000 20%,transparent);mask-image:linear-gradient(to top,#000 20%,transparent)}
.palm{position:absolute;bottom:-2%;height:46vh;opacity:.9}
.palm.l{left:-3vh}.palm.r{right:-3vh;transform:scaleX(-1)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);pointer-events:none}

/* ---------- WANTED poster card ---------- */
.poster{container-type:inline-size;position:relative;aspect-ratio:3/4.35;width:100%}
.pi{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.8cqw;padding:3.6cqw;border-radius:2.4cqw;background:linear-gradient(180deg,#1c0e33,#0d0618);box-shadow:0 0 0 .9cqw #0d0618,0 0 0 1.6cqw var(--pink),0 0 9cqw rgba(255,46,136,.45),0 3cqw 7cqw rgba(0,0,0,.6);overflow:hidden}
.p-top{text-align:center;line-height:1}
.p-stars{font-size:6.2cqw;letter-spacing:.6cqw;color:rgba(255,255,255,.18)}
.p-stars .on{color:var(--yellow);text-shadow:0 0 2.5cqw rgba(255,210,63,.8)}
.p-wanted{font-family:Anton,Impact,sans-serif;font-size:19cqw;line-height:.92;color:#fff;letter-spacing:.4cqw;text-shadow:.8cqw .8cqw 0 var(--pink),1.6cqw 1.6cqw 0 var(--orange)}
.p-sub{font-family:'Special Elite',monospace;font-size:3.7cqw;letter-spacing:.9cqw;color:var(--teal);margin-top:1cqw}
.mug{position:relative;flex:1;min-height:0;border-radius:1.4cqw;overflow:hidden;background:linear-gradient(180deg,#3d2d5c,#241838);border:.6cqw solid #000}
.mug img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.mug img.raw{filter:grayscale(1) contrast(1.45) brightness(1.06)}
.mug .tint{position:absolute;inset:0;background:linear-gradient(160deg,#ff2e88 0%,#ff8a3d 55%,#ffd23f 100%);mix-blend-mode:multiply;opacity:.62}
.mug .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(10,4,20,.55) 34%,transparent 36%);background-size:1.5cqw 1.5cqw;mix-blend-mode:multiply;opacity:.55}
.mug .chart{position:absolute;inset:0;pointer-events:none}
.mug .chart i{position:absolute;left:0;right:0;height:.35cqw;background:rgba(255,255,255,.28)}
.mug .chart b{position:absolute;left:1.5cqw;font:400 2.8cqw 'Special Elite',monospace;color:rgba(255,255,255,.75);transform:translateY(-120%)}
.mug .sil{position:absolute;left:50%;bottom:0;height:86%;transform:translateX(-50%)}
.placard{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:58%;background:#0b0612;border:.5cqw solid #d9d2e6;border-radius:.8cqw;text-align:center;padding:1.2cqw .5cqw;line-height:1.05;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
.placard.sm{width:44%;bottom:2.5%;padding:.7cqw .4cqw;opacity:.92}
.placard.sm b{font-size:4.8cqw}.placard.sm span{font-size:2cqw}
.placard span{display:block;font:400 2.5cqw 'Special Elite',monospace;color:#d9d2e6;letter-spacing:.3cqw}
.placard b{display:block;font:400 6.4cqw Anton,Impact,sans-serif;color:#fff;letter-spacing:.5cqw}
.badge{position:absolute;top:3%;left:3%;font:800 2.8cqw Inter,sans-serif;letter-spacing:.3cqw;background:var(--teal);color:#06121a;padding:.9cqw 1.8cqw;border-radius:99cqw;box-shadow:0 0 3cqw rgba(25,227,214,.7)}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-14deg);font:400 15cqw Anton,Impact,sans-serif;color:var(--red);border:1.3cqw solid var(--red);padding:0 3cqw;border-radius:2cqw;letter-spacing:.8cqw;background:rgba(255,51,85,.12);text-shadow:0 0 4cqw rgba(255,51,85,.6)}
.p-name{font-family:Anton,Impact,sans-serif;text-transform:uppercase;color:var(--yellow);line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 3cqw rgba(255,210,63,.45)}
.p-charge{font:400 3.6cqw 'Special Elite',monospace;color:#e9dcff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-reward{display:flex;justify-content:space-between;align-items:baseline;border-top:.4cqw dashed rgba(255,255,255,.25);padding-top:1.4cqw}
.p-reward span{font:400 3.5cqw 'Special Elite',monospace;color:var(--teal);letter-spacing:.5cqw;line-height:1.15}
.p-reward span i{display:block;font-style:normal;font-size:2.6cqw;letter-spacing:.2cqw;color:#cdb9ef}
.p-reward b{font:400 7.6cqw Anton,Impact,sans-serif;color:#fff;text-shadow:.5cqw .5cqw 0 var(--pink)}

/* ---------- Check-in (phone) ---------- */
.ck{max-width:480px;margin:0 auto;padding:22px 16px 60px}
.ck-head{text-align:center;margin:6px 0 18px}
.ck-head .stars{color:var(--yellow);font-size:22px;letter-spacing:6px;text-shadow:0 0 10px rgba(255,210,63,.7)}
.ck-head h1{font-family:Anton,Impact,sans-serif;font-size:64px;line-height:.95;letter-spacing:1px;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--orange)}
.ck-head .sub{font-family:'Special Elite',monospace;color:var(--teal);letter-spacing:4px;margin-top:8px}
.ck-head .ev{font-size:12px;letter-spacing:2px;color:#cdb9ef;margin-top:6px}
.ck-preview{width:62%;margin:0 auto 22px}
.form{background:rgba(13,6,24,.86);border:1px solid rgba(255,46,136,.35);border-radius:18px;padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.form h2{font-family:'Special Elite',monospace;font-weight:400;font-size:15px;letter-spacing:3px;color:var(--teal);margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:#cdb9ef;margin:16px 0 8px}
.lbl:first-of-type{margin-top:0}
.inp{width:100%;font-size:18px;padding:14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);outline:none}
.inp:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,136,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1.5px solid rgba(255,255,255,.18);background:transparent;font-size:14px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#06121a;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 6px;border-radius:14px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04)}
.tile .e{font-size:28px}.tile b{font-size:15px}.tile small{font-size:11px;color:#b9a6da}
.tile.on{border-color:var(--pink);background:rgba(255,46,136,.16);box-shadow:0 0 0 3px rgba(255,46,136,.25)}
.alt{display:block;margin:10px auto 0;background:none;border:none;color:#cdb9ef;text-decoration:underline;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05)}
.toggle div b{display:block;font-size:15px}.toggle div small{font-size:12px;color:#b9a6da}
.sw{position:relative;flex:none;width:52px;height:30px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.2);transition:.2s}
.sw span::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--pink)}
.sw input:checked+span::before{transform:translateX(22px)}
.go{width:100%;margin-top:20px;padding:16px;border:none;border-radius:14px;font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:2px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 8px 30px rgba(255,46,136,.45)}
.go:disabled{opacity:.6}
.err{color:#ff8fa3;font-size:14px;margin-top:10px;text-align:center;min-height:1em}
.fine{font-size:11px;color:#9c88c0;text-align:center;margin-top:12px;line-height:1.5}
.done{text-align:center}
.done .ck-preview{width:78%}
.done h2{font-family:Anton,Impact,sans-serif;font-size:34px;letter-spacing:1px;margin-bottom:6px}
.done p{color:#e2d6f7;line-height:1.5;margin:8px 0}
.done .pill{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:var(--yellow);font-size:14px}
.ghost{margin-top:22px;background:none;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 16px;font-size:14px}

/* ---------- Wall (big screen) ---------- */
.wall{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:2.2vh 2.4vw 0;gap:1.6vh;overflow:hidden}
.w-head{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.w-title{font-family:Anton,Impact,sans-serif;font-size:7.4vh;line-height:.95;text-shadow:.4vh .4vh 0 var(--pink),.8vh .8vh 0 var(--orange)}
.w-title small{display:block;font:400 2.1vh 'Special Elite',monospace;letter-spacing:.6vh;color:var(--teal);text-shadow:none;margin-top:1vh}
.w-right{display:flex;align-items:center;gap:2vw}
.w-count{text-align:right}
.w-count b{display:block;font:400 9vh/0.9 Anton,Impact,sans-serif;color:var(--yellow);text-shadow:0 0 3vh rgba(255,210,63,.5)}
.w-count span{font:400 1.9vh 'Special Elite',monospace;letter-spacing:.4vh;color:#e9dcff}
.w-qr{background:#fff;border-radius:1.2vh;padding:.9vh;text-align:center;color:#12081f}
.w-qr .q{width:13vh;height:13vh}.w-qr .q svg{width:100%;height:100%;display:block}
.w-qr span{display:block;font:800 1.3vh Inter,sans-serif;letter-spacing:.15vh;margin-top:.4vh}
.w-grid{min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2.6vh 2.4vw;transition:opacity .6s;width:100%}
.w-grid.fade{opacity:0}
.w-grid .poster{height:var(--h);width:calc(var(--h)*3/4.35)}
.w-empty{text-align:center}
.w-empty b{display:block;font:400 9vh Anton,Impact,sans-serif;text-shadow:.5vh .5vh 0 var(--pink)}
.w-empty span{font:400 2.6vh 'Special Elite',monospace;color:var(--teal);letter-spacing:.5vh}
.ticker{height:6vh;margin:0 -2.4vw;background:#0b0612;border-top:.4vh solid var(--pink);display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.ticker .tag{flex:none;height:100%;display:flex;align-items:center;padding:0 2vw;background:var(--red);font:400 3vh Anton,Impact,sans-serif;letter-spacing:.3vh;z-index:1}
.ticker .run{display:inline-block;padding-left:100%;font:400 2.6vh 'Special Elite',monospace;color:#f3eaff;animation:tick var(--dur,60s) linear infinite}
.ticker .run em{color:var(--yellow);font-style:normal}
@keyframes tick{to{transform:translateX(-100%)}}
.spot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:5vw;background:rgba(8,3,16,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadein .4s}
.spot .poster{height:78vh;width:calc(78vh*3/4.35);animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
.spot .txt{max-width:42vw}
.spot .alert{font:400 5vh Anton,Impact,sans-serif;letter-spacing:.4vh;animation:siren .5s steps(1) infinite}
.spot .nm{font:400 13vh/0.95 Anton,Impact,sans-serif;color:var(--yellow);text-transform:uppercase;margin:2vh 0;word-break:break-word}
.spot .ch{font:400 3.2vh 'Special Elite',monospace;color:#e9dcff;line-height:1.4}
.spot .lv{font-size:5vh;color:var(--yellow);letter-spacing:1vh;margin-top:2vh}
.siren{position:fixed;left:0;right:0;height:2.2vh;z-index:21;animation:sirenbg .5s steps(1) infinite}
.siren.t{top:0}.siren.b{bottom:0}
@keyframes siren{0%{color:#ff3355}50%{color:#3d8bff}}
@keyframes sirenbg{0%{background:#ff3355}50%{background:#3d8bff}}
@keyframes fadein{from{opacity:0}}
@keyframes slam{from{transform:scale(1.6) rotate(-6deg);opacity:0}}
.fs-hint{position:fixed;bottom:8vh;right:2vw;z-index:5;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:8px;font-size:13px;transition:opacity 1s}

/* ---------- Raffle ---------- */
.rf{height:100vh;display:grid;grid-template-columns:1fr 30vw;gap:3vw;padding:3vh 3vw;overflow:hidden}
.rf-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.rf-title{font:400 6vh/1 Anton,Impact,sans-serif;text-shadow:.4vh .4vh 0 var(--pink),.8vh .8vh 0 var(--orange);text-align:center}
.rf-title small{display:block;font:400 2vh 'Special Elite',monospace;letter-spacing:.5vh;color:var(--teal);text-shadow:none;margin-top:1vh}
.rf-slot .poster{height:66vh;width:calc(66vh*3/4.35)}
.rf-slot.land .poster{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
.rf-side{display:flex;flex-direction:column;gap:2vh;justify-content:center}
.panel{background:rgba(13,6,24,.85);border:1px solid rgba(255,46,136,.35);border-radius:2vh;padding:2.4vh}
.panel h3{font:400 1.8vh 'Special Elite',monospace;letter-spacing:.4vh;color:var(--teal);margin-bottom:1.4vh;font-weight:400}
.prizes{display:flex;gap:1vw}
.prize{flex:1;padding:1.6vh 1vw;border-radius:1.4vh;border:2px solid rgba(255,255,255,.2);background:transparent;font:400 2.6vh Anton,Impact,sans-serif;letter-spacing:.2vh}
.prize.on{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 2vh rgba(255,210,63,.35)}
.prize.taken{opacity:.45;text-decoration:line-through}
.pool{font:400 8vh/1 Anton,Impact,sans-serif;color:var(--yellow)}
.pool small{font:400 2vh 'Special Elite',monospace;color:#e9dcff;margin-left:1vw}
.bigbtn{width:100%;padding:2.4vh;border:none;border-radius:1.6vh;font:400 4vh Anton,Impact,sans-serif;letter-spacing:.4vh;color:#fff;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 1vh 4vh rgba(255,46,136,.45)}
.bigbtn:disabled{opacity:.5}
.btnrow{display:flex;gap:1vw}
.btnrow button{flex:1;padding:2vh 1vw;border-radius:1.4vh;border:none;font:400 2.6vh Anton,Impact,sans-serif;letter-spacing:.2vh}
.ok{background:#20c472;color:#04170c}.no{background:#3a2c55;color:#fff}
.winners{list-style:none;display:flex;flex-direction:column;gap:1vh}
.winners li{display:flex;justify-content:space-between;align-items:center;gap:1vw;font-size:2.2vh}
.winners li b{color:var(--yellow);font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.1vh}
.winners li button{background:none;border:1px solid rgba(255,255,255,.25);border-radius:.8vh;padding:.4vh .8vw;font-size:1.5vh}
.keys{font-size:1.6vh;color:#9c88c0;text-align:center}
.claim{font:400 3.6vh Anton,Impact,sans-serif;letter-spacing:.3vh;color:var(--yellow);background:rgba(13,6,24,.85);border:2px solid var(--yellow);border-radius:1.4vh;padding:1.2vh 2.4vw;text-align:center;box-shadow:0 0 3vh rgba(255,210,63,.35)}
.caught-txt{font:400 9vh/1 Anton,Impact,sans-serif;color:var(--red);text-shadow:0 0 4vh rgba(255,51,85,.6);animation:siren .5s steps(1) 6}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

/* ---------- Admin ---------- */
.ad{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.ad h1{font:400 34px Anton,Impact,sans-serif;letter-spacing:1px;text-shadow:2px 2px 0 var(--pink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bar a,.bar button,.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font-size:14px;cursor:pointer}
.bar .hot{background:var(--pink);border-color:var(--pink)}
.bar .danger{border-color:#ff5d73;color:#ff8fa3}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#cdb9ef;margin:6px 0 14px}
.stats b{color:var(--yellow);font-size:20px;margin-right:4px}
.ad-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:12px;background:rgba(13,6,24,.8);border:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.ad-row .th{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#2a1d42;display:flex;align-items:center;justify-content:center;font-size:24px}
.ad-row .nm b{font-size:16px}.ad-row .nm small{display:block;color:#b9a6da;font-size:12px;margin-top:3px}
.ad-row .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.ad-row select{background:#1d1230;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px}
.ad-row .ai{width:40px;height:40px;border-radius:6px;object-fit:cover;border:2px solid var(--teal)}
.need{border-color:rgba(25,227,214,.6)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);margin-left:6px}
.tag.won{background:var(--yellow);color:#000}.tag.absent{background:#555}.tag.hidden{background:#802}
.prompt{background:rgba(13,6,24,.85);border:1px solid rgba(25,227,214,.4);border-radius:12px;padding:14px;margin:14px 0}
.prompt p{font-size:13px;color:#cdb9ef;line-height:1.5;margin-top:8px}
.pin{max-width:320px;margin:20vh auto;text-align:center}
.demo{position:fixed;left:0;right:0;top:0;z-index:100;background:#ffd23f;color:#000;font-size:12px;font-weight:700;text-align:center;padding:4px}
@media (max-width:640px){.ad-row{grid-template-columns:52px 1fr}.ad-row .acts{grid-column:1/-1;justify-content:flex-start}.ad-row .th{width:52px;height:52px}}
</style>
</head>

function uuid(){ if (crypto.randomUUID) return crypto.randomUUID(); return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }); }

const fmtTime = iso => { try { return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); } catch { return ""; } };

/* Resize + convert to JPEG on the phone (also turns iPhone HEIC into JPEG) */
async function compressImage(file, max = 1100, q = 0.84){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    if (!blob) throw new Error("encode");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- data store: Supabase (live) or localStorage (demo) ---------------- */
function supaStore(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const B = CONFIG.BUCKET;
  const pub = p => p ? sb.storage.from(B).getPublicUrl(p).data.publicUrl : null;
  const deco = r => ({ ...r, photo_url: pub(r.photo_path), styled_url: pub(r.styled_path) });
  const put = async (path, blob, upsert) => { const { error } = await sb.storage.from(B).upload(path, blob, { contentType: "image/jpeg", upsert: !!upsert }); if (error) throw error; };
  const list = async () => { const { data, error } = await sb.from("suspects").select("*").order("num", { ascending: true }); if (error) throw error; return data.map(deco); };
  const S = {
    mode: "live", list,
    async add({ id, name, role, photo_type, consent, blob }){
      let photo_path = null;
      if (blob) { photo_path = `${id}/original.jpg`; await put(photo_path, blob, true); }
      const { data, error } = await sb.from("suspects").upsert({ id, name, role, photo_type, consent, photo_path }).select().single();
      if (error) throw error; return deco(data);
    },
    async update(id, patch){ const { error } = await sb.from("suspects").update(patch).eq("id", id); if (error) throw error; },
    async setStyled(id, blob){ const p = `${id}/rendered-${Date.now()}.jpg`; await put(p, blob, false); await S.update(id, { styled_path: p }); },
    async reset(){ const { error } = await sb.from("suspects").delete().not("id", "is", null); if (error) throw error; },
    subscribe(cb, onErr){
      let t = null;
      const run = async () => { try { cb(await list()); } catch (e) { onErr && onErr(e); } };
      const kick = () => { clearTimeout(t); t = setTimeout(run, 250); };
      run();
      sb.channel("suspects-" + Math.random().toString(36).slice(2))
        .on("postgres_changes", { event: "*", schema: "public", table: "suspects" }, kick).subscribe();
      setInterval(run, 12000); // safety net if realtime drops
    },
  };
  return S;
}

function localStore(){
  const KEY = "dor_demo_v1"; let mem = null; const subs = new Set();
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("dor") : null;
  const read = () => { if (mem) return mem; try { const s = localStorage.getItem(KEY); mem = s ? JSON.parse(s) : []; } catch { mem = []; } return mem; };
  const deco = r => ({ ...r, photo_url: r.photo_data || null, styled_url: r.styled_data || null });
  const notify = () => { const l = read().map(deco); subs.forEach(f => f(l)); };
  const write = rows => { mem = rows; try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch { console.warn("demo storage full — memory only"); } notify(); bc && bc.postMessage(1); };
  const external = () => { mem = null; notify(); };
  if (bc) bc.onmessage = external;
  addEventListener("storage", e => { if (e.key === KEY) external(); });
  const toData = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
  return {
    mode: "demo",
    async list(){ return read().map(deco); },
    async add({ id, name, role, photo_type, consent, blob }){
      const rows = [...read()]; const num = rows.reduce((m, r) => Math.max(m, r.num), 0) + 1;
      const r = { id, num, created_at: new Date().toISOString(), name, role, photo_type, consent, status: "active", prize: null, photo_path: blob ? "local" : null, styled_path: null, photo_data: blob ? await toData(blob) : null, styled_data: null };
      rows.push(r); write(rows); return deco(r);
    },
    async update(id, patch){ write(read().map(r => r.id === id ? { ...r, ...patch, ...(patch.styled_path === null ? { styled_data: null } : {}) } : r)); },
    async setStyled(id, blob){ const d = await toData(blob); write(read().map(r => r.id === id ? { ...r, styled_data: d, styled_path: "local-" + Date.now() } : r)); },
    async reset(){ write([]); },
    subscribe(cb){ subs.add(cb); cb(read().map(deco)); },
  };
}

  setTimeout(() => { const h = $("#hint"); if (h) h.style.opacity = 0; }, 6000);

  let rows = [], page = 0, first = true;

  addEventListener("resize", () => { if (!showing) renderGrid(); });

  const visible = () => rows.filter(r => r.status !== "hidden").sort((a, b) => b.num - a.num);
  function renderGrid(){
    const v = visible(); const g = $("#grid");
    $("#cnt").textContent = v.length;

    const pages = Math.ceil(v.length / PER); page = page % pages;
    const slice = v.slice(page * PER, page * PER + PER);
    const n = slice.length, rowsN = n <= 4 ? 1 : 2, cols = Math.ceil(n / rowsN);
    const box = g.getBoundingClientRect(), gapY = innerHeight * 0.026, gapX = innerWidth * 0.024;
    const hByH = (box.height - gapY * (rowsN - 1)) / rowsN - 4;
    const hByW = ((box.width - gapX * (cols - 1)) / cols) * 4.35 / 3 - 4;
    g.style.setProperty("--h", Math.max(80, Math.min(hByH, hByW)) + "px");

  function renderTicker(){

    run.style.setProperty("--dur", Math.max(40, items.length * 7) + "s");
  }
  async function playQueue(){
    if (showing) return; showing = true;
    while (queue.length) {
      const { id, kind } = queue.shift();
      const r = rows.find(x => x.id === id); if (!r || r.status === "hidden") continue;
      const p = profile(r);
      const el = document.createElement("div");
      el.innerHTML = `<div class="siren t"></div><div class="siren b"></div><div class="spot">${posterHTML(r)}<div class="txt">

      if (!known.has(r.id)) { if (!first) queue.push({ id: r.id, kind: "new" }); }
      else if (r.styled_path && known.get(r.id) !== r.styled_path && r.consent) { if (!first) queue.push({ id: r.id, kind: "rendered" }); }
      known.set(r.id, r.styled_path);

    }

    renderTicker();
    playQueue();
  }, e => console.error(e));
  setInterval(() => {
    if (showing) return;
    const v = visible(); if (v.length <= PER) return;
    const g = $("#grid"); g.classList.add("fade");
    setTimeout(() => { page++; renderGrid(); g.classList.remove("fade"); }, 650);
  }, 9000);
}

/* ======================= PAGE: RAFFLE ======================= */
let actx;
function beep(f = 880, d = .05, v = .05, type = "square"){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d + .02); } catch {}
}
function confetti(){
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"); const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#ff2e88","#ff8a3d","#ffd23f","#19e3d6","#ffffff"];
  const P = Array.from({ length: 260 }, () => ({ x: W * (.3 + Math.random() * .4), y: H * .4, vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 6, s: 6 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * 5 | 0] }));
  let t = 0; (function f(){ x.clearRect(0, 0, W, H); for (const p of P) { p.vy += .7; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); } if (++t < 260) requestAnimationFrame(f); else c.remove(); })();
}

function Raffle(){
  app.innerHTML = skyHTML(false) + `<div class="rf">
    <section class="rf-stage">
      <div class="rf-title">LIVE RAFFLE · <span id="pz"></span><small>MUST BE PRESENT TO WIN · ONE PRIZE PER SUSPECT</small></div>
      <div class="rf-slot" id="slot"></div>
      <div class="caught-txt hidden" id="caught">CAUGHT!</div>
      <div class="claim hidden" id="claim">🎮 COME FIND HAINA TO CLAIM YOUR PS5 PRO</div>
    </section>
    <aside class="rf-side">
      <div class="panel"><h3>PRIZE</h3><div class="prizes" id="prizes"></div></div>
      <div class="panel"><h3>SUSPECTS IN THE POOL</h3><div class="pool"><span id="pool">0</span><small>eligible</small></div></div>
      <div class="panel" id="ctl"></div>
      <div class="panel"><h3>CAUGHT SO FAR</h3><ul class="winners" id="winners"></ul></div>
      <div class="panel hidden" id="skipP"><h3>SKIPPED · NOT IN THE ROOM</h3><ul class="winners" id="skipped"></ul></div>
      <div class="keys">SPACE = draw · Y = present · N = not here, redraw</div>
    </aside></div>`;

  let rows = [], phase = "idle", winner = null;
  let prize = null;
  const pool = () => rows.filter(r => r.status === "active");
  const taken = pz => rows.some(r => r.status === "won" && r.prize === pz);
  const pickPrize = () => { if (!prize || taken(prize)) prize = CONFIG.PRIZES.find(p => !taken(p)) || CONFIG.PRIZES[CONFIG.PRIZES.length - 1]; };
  const slot = $("#slot");
  const showCard = (r, land) => { slot.classList.remove("land"); slot.innerHTML = posterHTML(r); if (land) { void slot.offsetWidth; slot.classList.add("land"); } };
  const mystery = () => showCard({ id: "mystery-x", num: 0, name: "WHO'S NEXT?", consent: false, status: "active" });

  function renderSide(){
    pickPrize();
    $("#pz").textContent = prize;
    $("#prizes").innerHTML = CONFIG.PRIZES.map(p => `<button class="prize ${p === prize ? "on" : ""} ${taken(p) ? "taken" : ""}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
    $("#pool").textContent = pool().length;
    const ctl = $("#ctl");
    if (phase === "landed") ctl.innerHTML = `<h3>IS ${esc(winner.name.toUpperCase())} IN THE ROOM?</h3><div class="btnrow"><button class="ok" id="yes">✅ PRESENT</button><button class="no" id="no">❌ REDRAW</button></div>`;
    else ctl.innerHTML = `<button class="bigbtn" id="draw" ${phase === "drawing" || !pool().length ? "disabled" : ""}>${phase === "drawing" ? "SEARCHING…" : "🚨 DRAW SUSPECT"}</button>`;
    const w = rows.filter(r => r.status === "won");
    const sk = rows.filter(r => r.status === "absent");
    $("#skipP").classList.toggle("hidden", !sk.length);
    $("#skipped").innerHTML = sk.map(r => `<li><span>${esc(r.name)}</span><button data-undo="${r.id}">put back</button></li>`).join("");
    $("#winners").innerHTML = w.length ? w.map(r => `<li><span><b>${esc(r.prize || "")}</b> · ${esc(r.name)}</span><button data-undo="${r.id}">undo</button></li>`).join("") : `<li style="color:#9c88c0">Nobody yet</li>`;
  }
  $(".rf-side").addEventListener("click", async e => {
    const p = e.target.closest("[data-p]"); if (p && phase !== "drawing") { prize = p.dataset.p; renderSide(); return; }
    if (e.target.id === "draw") draw();
    if (e.target.id === "yes") confirm();
    if (e.target.id === "no") redraw();
    const u = e.target.closest("[data-undo]");
    if (u && window.confirm("Put " + (rows.find(r => r.id === u.dataset.undo) || {}).name + " back in the pool?")) { await store.update(u.dataset.undo, { status: "active", prize: null }); }
  });
  addEventListener("keydown", e => {
    if (e.code === "Space" && phase === "idle") { e.preventDefault(); draw(); }
    else if ((e.key === "y" || e.key === "Y") && phase === "landed") confirm();
    else if ((e.key === "n" || e.key === "N") && phase === "landed") redraw();
  });

  async function draw(){
    const p = pool(); if (!p.length || phase === "drawing") return;
    phase = "drawing"; $("#caught").classList.add("hidden"); $("#claim").classList.add("hidden"); renderSide();
    winner = p[randInt(p.length)];
    let d = 55, total = 0, last = null;
    while (total < 4600 && p.length > 1) {
      let r; do { r = p[Math.random() * p.length | 0]; } while (r === last && p.length > 1);
      last = r; showCard(r); beep(660 + Math.random() * 300, .035, .04);
      await sleep(d); total += d; d = Math.min(d * 1.085, 420);
    }
    showCard(winner, true);
    beep(523, .18, .08, "triangle"); setTimeout(() => beep(659, .18, .08, "triangle"), 150); setTimeout(() => beep(784, .4, .08, "triangle"), 300);
    $("#caught").classList.remove("hidden");
    confetti();
    phase = "landed"; renderSide();
  }
  async function confirm(){
    if (phase !== "landed") return;
    const w = winner, pz = prize; phase = "idle";
    $("#caught").classList.add("hidden"); $("#claim").classList.remove("hidden");
    try { await store.update(w.id, { status: "won", prize: pz }); } catch (e) { alert("Save failed. Check Wi-Fi and press Y again."); phase = "landed"; }
    renderSide();
  }
  async function redraw(){
    if (phase !== "landed") return;
    const w = winner; phase = "idle"; $("#caught").classList.add("hidden");
    try { await store.update(w.id, { status: "absent" }); } catch {}
    rows = rows.map(r => r.id === w.id ? { ...r, status: "absent" } : r);
    renderSide(); draw();
  }
  mystery();
  store.subscribe(list => {
    rows = list;
    if (winner) { const fresh = list.find(r => r.id === winner.id); if (fresh) winner = fresh; }
    for (const r of list) if (r.photo_url) { const i = new Image(); i.src = r.styled_url || r.photo_url; }
    if (phase !== "drawing") renderSide();
    if (phase === "idle" && winner && winner.status === "won") showCard(winner);
  }, e => console.error(e));
}

/* ======================= PAGE: STAFF / ADMIN ======================= */
function Admin(){
  if (sessionStorage.getItem("dor_pin") !== CONFIG.ADMIN_PIN) {
    app.innerHTML = skyHTML(false) + `<form class="pin form" id="pf"><h2>// STAFF ONLY</h2><input class="inp" id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="go">ENTER</button><div class="err" id="perr"></div></form>`;
    $("#pf").onsubmit = e => { e.preventDefault(); if ($("#pin").value === CONFIG.ADMIN_PIN) { sessionStorage.setItem("dor_pin", CONFIG.ADMIN_PIN); Admin(); } else $("#perr").textContent = "Wrong PIN"; };
    return;
  }
  const base = location.origin + location.pathname;
  app.innerHTML = skyHTML(false) + `<main class="ad">
    <h1>STAFF HQ · DEAD OR RENDERED</h1>
    <div class="bar">
      <a href="${base}#wall" target="_blank">🖥️ Wall</a><a href="${base}#raffle" target="_blank">🎮 Raffle</a><a href="${base}" target="_blank">📱 Check-in</a>
      <a class="hot" href="${CONFIG.TRIPO_URL}" target="_blank">✦ Open Tripo</a>
      <button id="csv">⬇ Export CSV (leads)</button>
      ${store.mode === "demo" ? `<button id="fake">+ 12 fake suspects</button>` : ""}
      <button class="danger" id="reset">Reset ALL data</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="prompt"><b>Tripo prompts</b> — Nano Banana Pro · 3:4 · 1 image
      <div class="bar"><button data-copy="p">📋 Copy PERSON prompt</button><button data-copy="a">📋 Copy ANIMAL prompt</button></div>
      <p>Flow: rows outlined in teal need a render → tap <b>Original</b> to save the photo → generate in Tripo → tap <b>Upload AI</b> on that row. The wall swaps it in automatically.</p></div>
    <div class="bar"><button data-f="all" class="hot">All</button><button data-f="need">Needs render</button><button data-f="won">Winners</button><input class="inp" id="q" placeholder="Search name" style="max-width:220px;padding:8px 12px;font-size:14px"></div>
    <div id="list"></div></main>`;

  let rows = [], filter = "all", sig = "";
  const needs = r => r.consent && r.photo_url && !r.styled_url && r.status !== "hidden";
  function render(force){
    const q = ($("#q").value || "").toLowerCase();
    let v = [...rows].sort((a, b) => b.num - a.num);
    if (filter === "need") v = v.filter(needs);
    if (filter === "won") v = v.filter(r => r.status === "won");
    if (q) v = v.filter(r => (r.name || "").toLowerCase().includes(q));
    const s = JSON.stringify([filter, q, v.map(r => [r.id, r.status, r.consent, r.styled_path, r.prize])]);
    if (s === sig && !force) return; sig = s;
    const act = rows.filter(r => r.status !== "hidden");
    $("#stats").innerHTML = `<span><b>${act.length}</b>checked in</span><span><b>${act.filter(r => r.photo_url).length}</b>with photo</span><span><b>${rows.filter(needs).length}</b>need render</span><span><b>${act.filter(r => r.status === "active").length}</b>in raffle pool</span><span>Mode: <b style="font-size:14px">${store.mode === "live" ? "LIVE" : "DEMO"}</b></span>`;
    $("#list").innerHTML = v.length ? v.map(r => `<div class="ad-row ${needs(r) ? "need" : ""}" data-id="${r.id}">
      ${r.photo_url ? `<img class="th" src="${esc(r.photo_url)}">` : `<div class="th">${r.photo_type === "none" ? "🙈" : "?"}</div>`}
      <div class="nm"><b>#${pad(r.num)} ${esc(r.name)}</b>${r.status !== "active" ? `<span class="tag ${r.status}">${esc(r.status)}${r.prize ? " · " + esc(r.prize) : ""}</span>` : ""}
        <small>${esc(r.role || "—")} · ${esc(r.photo_type)} · ${fmtTime(r.created_at)}</small></div>
      <div class="acts">
        <label class="btn"><input type="checkbox" data-act="consent" ${r.consent ? "checked" : ""}> On wall</label>
        <select data-act="status">${["active","won","absent","hidden"].map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
        ${r.photo_url ? `<a class="btn" href="${esc(r.photo_url + (store.mode === "live" ? "?download=suspect-" + pad(r.num) + ".jpg" : ""))}" download="suspect-${pad(r.num)}.jpg">⬇ Original</a>
        <label class="btn">⬆ Upload AI<input type="file" accept="image/*" data-act="styled" hidden></label>` : ""}
        ${r.styled_url ? `<img class="ai" src="${esc(r.styled_url)}"><button class="btn" data-act="unstyle" title="Remove AI version">✕</button>` : ""}
      </div></div>`).join("") : `<p style="color:#9c88c0;padding:20px">Nothing here.</p>`;
  }
  $(".ad").addEventListener("click", async e => {
    const f = e.target.closest("[data-f]");
    if (f) { filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("hot", b === f)); render(true); return; }
    const c = e.target.closest("[data-copy]");
    if (c) { try { await navigator.clipboard.writeText(c.dataset.copy === "p" ? PROMPT_PERSON : PROMPT_ANIMAL); c.textContent = "✅ Copied"; setTimeout(() => c.textContent = c.dataset.copy === "p" ? "📋 Copy PERSON prompt" : "📋 Copy ANIMAL prompt", 1500); } catch { prompt("Copy this:", c.dataset.copy === "p" ? PROMPT_PERSON : PROMPT_ANIMAL); } return; }
    const u = e.target.closest("[data-act=unstyle]");
    if (u && confirm("Remove the AI version?")) await store.update(u.closest(".ad-row").dataset.id, { styled_path: null });
    if (e.target.id === "csv") {
      const head = ["num","name","role","photo_type","on_wall","status","prize","checked_in"];
      const lines = [head.join(",")].concat([...rows].sort((a, b) => a.num - b.num).map(r => [r.num, r.name, r.role || "", r.photo_type, r.consent, r.status, r.prize || "", r.created_at].map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })); a.download = "game-night-checkins.csv"; a.click();
    }
    if (e.target.id === "reset") { if (prompt("This deletes every check-in. Type RESET to confirm.") === "RESET") { await store.reset(); } }
    if (e.target.id === "fake") {
      const names = ["Alex Rivera","Mina Park","Jordan Lee","Sam Okafor","Priya Shah","Diego Morales","Hana Kim","Chris Novak","Leo Martins","Ava Thompson","Kenji Watanabe","Zoe Laurent"];
      for (const n of names) await store.add({ id: uuid(), name: n, role: ["Film / VFX","Game Dev","Founder / Exec","AI / Tech"][names.indexOf(n)%4], photo_type: "none", consent: true, blob: null });
    }
  });
  $(".ad").addEventListener("change", async e => {
    const row = e.target.closest(".ad-row"); if (!row) return; const id = row.dataset.id;
    const a = e.target.dataset.act;
    try {
      if (a === "consent") await store.update(id, { consent: e.target.checked });
      if (a === "status") { const s = e.target.value; await store.update(id, { status: s, ...(s !== "won" ? { prize: null } : {}) }); }
      if (a === "styled" && e.target.files[0]) { e.target.parentElement.firstChild.textContent = "⏳ Uploading…"; const blob = await compressImage(e.target.files[0], 1400, .88); await store.setStyled(id, blob); }
    } catch (ex) { console.error(ex); alert("Save failed: " + (ex.message || ex)); }
  });
  $("#q").addEventListener("input", () => render(true));
  store.subscribe(list => { rows = list; render(); }, e => console.error(e));
}

if (!LIVE) { const d = document.createElement("div"); d.className = "demo"; d.textContent = "DEMO MODE — data stays in this browser. Add Supabase keys in CONFIG to go live."; document.body.appendChild(d); }
const route = (location.hash || "").replace("#", "").toLowerCase();
if (route === "wall") Wall();
else if (route === "raffle") Raffle();
else if (route === "admin" || route === "staff") Admin();
else Checkin();
addEventListener("hashchange", () => location.reload());
</script>
